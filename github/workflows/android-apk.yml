name: Compilar APK de prueba
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Ejecutar pruebas y compilar APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: RutaGPSLibre-APK-prueba
          path: app/build/outputs/apk/debug/app-debug.apk
